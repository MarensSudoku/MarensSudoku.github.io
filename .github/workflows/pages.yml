name: Check and publish Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
    strategy:
      matrix:
        browser: [chromium, webkit]
        suite: [browser, aquarium]
    name: check (${{ matrix.browser }}, ${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Read checked release version
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { RELEASE } from './web/release.mjs';
          appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + RELEASE.version + '\n');
          NODE
      - name: Reject a version already used by another commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_VERSION" --jq '.[].ref')
          if printf '%s\n' "$refs" | grep -Fxq "refs/tags/$RELEASE_VERSION"; then
            tagged_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_VERSION" --jq .sha)
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              printf 'Version %s already belongs to another commit. Increase the release version.\n' "$RELEASE_VERSION" >&2
              exit 1
            fi
          fi
      - name: Check the built game in ${{ matrix.browser }}
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          node scripts/serve.mjs &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node --input-type=module -e 'for(let i=0;i<40;i++){try{if((await fetch("http://127.0.0.1:4175/")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,250))}process.exit(1)'
          npm run test:${{ matrix.suite }}
      # Every leg builds the same dist; one upload is enough for the deploy.
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request' && matrix.browser == 'chromium' && matrix.suite == 'browser'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Publish checked release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { RELEASE } from './web/release.mjs';
          assert.equal(RELEASE.version, process.env.RELEASE_VERSION);
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.txt'), RELEASE.date + '\n\n' + RELEASE.notes.en.map(note => '- ' + note).join('\n') + '\n');
          NODE
          if ! gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "MarensSudoku $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.txt" --latest
          fi
